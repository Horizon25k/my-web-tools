<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - ไม่พบหน้าที่ต้องการ | My Web Tools</title>
    
    <!-- ป้องกันแสงสลับวูบวาบ (FOUC Mitigation) -->
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            } else {
                document.documentElement.classList.remove('dark-mode');
            }
        })();
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '.dark-mode'],
        }
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-300">

    <!-- Top Navigation Bar -->
    <header class="max-w-6xl w-full mx-auto pt-6 px-4 sm:px-6 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 group">
            <div class="w-8 h-8 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-extrabold text-sm shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                W
            </div>
            <span class="font-bold text-base tracking-tight text-gray-900 dark:text-white">WebTools</span>
        </a>

        <!-- ปุ่มสลับธีม -->
        <button id="theme-toggle" class="flex items-center justify-center w-10 h-10 bg-white/80 dark:bg-slate-900/80 border border-gray-200/80 dark:border-slate-800 rounded-full shadow-sm text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-white dark:hover:bg-slate-900 transition-all duration-200 backdrop-blur-md focus:outline-none" aria-label="Toggle Dark Mode">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 text-center my-auto py-12">
        <!-- Icon Banner -->
        <div class="relative inline-flex items-center justify-center w-24 h-24 mb-6">
            <div class="absolute inset-0 bg-indigo-500/10 dark:bg-indigo-500/20 rounded-3xl blur-xl"></div>
            <div class="relative w-24 h-24 bg-white dark:bg-slate-900 border border-gray-100 dark:border-slate-800 rounded-3xl shadow-xl flex items-center justify-center text-indigo-600 dark:text-indigo-400">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 3h.01"></path>
                </svg>
            </div>
        </div>

        <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-violet-600 mb-2 tracking-tight">404</h1>
        <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-3">ไม่พบหน้าที่คุณกำลังตามหา</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed mb-8">
            หน้าเว็บนี้อาจถูกย้าย เปลี่ยนชื่อ หรือลบออกไปแล้ว หรืออาจเป็นเครื่องมือที่เปิดใช้งานเฉพาะใน Localhost เท่านั้น
        </p>

        <!-- Back Button -->
        <a href="/" class="inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3.5 rounded-2xl shadow-lg shadow-indigo-500/25 transition-all duration-200 active:scale-95 text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            <span>กลับสู่หน้าหลัก</span>
        </a>
    </main>

    <!-- Footer Space -->
    <footer class="py-6 text-center text-xs text-gray-400">
        My Web Tools &copy; 2026
    </footer>

    <script src="/static/js/theme.js"></script>
</body>
</html>
