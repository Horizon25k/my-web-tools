<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>TikTok Video Downloader</title>
    
    <!-- ป้องกันแสงสีขาววูบวาบ (FOUC Mitigation - ซิงก์กับ theme.js) -->
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            } else {
                document.documentElement.classList.remove('dark-mode');
            }
        })();
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '.dark-mode'],
        }
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between antialiased selection:bg-pink-500 selection:text-white transition-colors duration-300">

    <!-- Top Navigation Bar -->
    <header class="max-w-4xl mx-auto pt-6 px-4 sm:px-6 flex items-center justify-between w-full">
        <a href="/" class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 bg-white/80 dark:bg-slate-900/80 hover:bg-white dark:hover:bg-slate-900 border border-gray-200/80 dark:border-slate-800 rounded-full shadow-sm hover:shadow transition-all duration-200 backdrop-blur-md group">
            <svg class="w-4 h-4 transition-transform group-hover:-translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            หน้าหลัก
        </a>

        <!-- ปุ่มสลับธีม -->
        <button id="theme-toggle" class="flex items-center justify-center w-10 h-10 bg-white/80 dark:bg-slate-900/80 border border-gray-200/80 dark:border-slate-800 rounded-full shadow-sm text-gray-600 dark:text-gray-300 hover:text-pink-600 dark:hover:text-pink-400 hover:bg-white dark:hover:bg-slate-900 transition-all duration-200 backdrop-blur-md focus:outline-none" aria-label="Toggle Dark Mode">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-4 sm:px-6 pt-10 pb-16 w-full">
        
        <!-- Hero Title -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-pink-50 dark:bg-pink-950/40 text-pink-600 dark:text-pink-400 rounded-2xl mb-4 shadow-lg shadow-pink-500/10 border border-pink-100/80 dark:border-pink-900/50">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 448 512">
                    <path d="M448 209.91a210.06 210.06 0 0 1-122.77-39.25V349.38A162.55 162.55 0 1 1 185 188.31v89.89a74.62 74.62 0 1 0 52.23 71.18V0l88 0a121.18 121.18 0 0 0 1.86 22.17h0A122.18 122.18 0 0 0 381 102.39a121.43 121.43 0 0 0 67 20.14Z"/>
                </svg>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white mb-2">
                TikTok Downloader
            </h1>
            <p class="text-sm sm:text-base text-gray-500 dark:text-gray-400 max-w-md mx-auto">
                ดาวน์โหลดวิดีโอ TikTok แบบไม่มีลายน้ำ HD หรือเลือกโหลดเฉพาะไฟล์เสียง MP3
            </p>
        </div>
        
        <!-- Input Card -->
        <div class="bg-white dark:bg-slate-900 p-3 sm:p-4 rounded-3xl shadow-xl shadow-gray-200/50 dark:shadow-none border border-gray-100 dark:border-slate-800 transition-all">
            <div class="relative flex items-center">
                <div class="absolute left-4 text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                    </svg>
                </div>
                <input type="text" id="tk-url-input" 
                    class="w-full pl-11 pr-28 py-3.5 bg-gray-50/70 dark:bg-slate-800/80 text-gray-900 dark:text-white rounded-2xl border border-transparent focus:border-pink-500/30 focus:bg-white dark:focus:bg-slate-800 focus:ring-0 text-sm transition-all placeholder:text-gray-400 dark:placeholder:text-gray-500 font-medium" 
                    placeholder="วางลิงก์ TikTok ที่นี่...">
                <button onclick="fetchTikTok()" 
                    class="absolute right-1.5 bg-pink-600 hover:bg-pink-700 text-white text-xs sm:text-sm font-semibold px-5 py-2.5 rounded-xl transition-all shadow-md shadow-pink-500/20 active:scale-95 flex items-center gap-1.5">
                    <span>ดึงข้อมูล</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Status Loading -->
        <div id="tk-loading" class="hidden text-center py-12">
            <div class="inline-flex items-center justify-center p-3 bg-white dark:bg-slate-900 rounded-full shadow-md border border-gray-100 dark:border-slate-800 mb-3">
                <div class="animate-spin rounded-full h-6 w-6 border-2 border-pink-100 dark:border-pink-950 border-t-pink-600"></div>
            </div>
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider" id="loading-text">กำลังประมวลผลวิดีโอ TikTok...</p>
        </div>

        <!-- Result Display -->
        <div id="tk-result" class="hidden mt-6 bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 shadow-xl shadow-gray-200/50 dark:shadow-none border border-gray-100 dark:border-slate-800 transition-all">
            <div class="flex flex-col sm:flex-row gap-5 items-start">
                
                <!-- Thumbnail -->
                <div class="w-full sm:w-5/12 relative group overflow-hidden rounded-2xl border border-gray-100 dark:border-slate-800 bg-gray-900">
                    <img id="tk-thumbnail" class="w-full aspect-video object-cover group-hover:scale-105 transition-transform duration-300" src="" alt="Thumbnail">
                </div>

                <!-- Detail & Download Buttons -->
                <div class="w-full sm:w-7/12 flex flex-col justify-between self-stretch">
                    <div>
                        <!-- Author Info -->
                        <div class="flex items-center gap-2 mb-2">
                            <img id="tk-avatar" class="w-6 h-6 rounded-full border border-gray-200 dark:border-slate-700 object-cover" src="" alt="Avatar">
                            <h3 id="tk-author" class="text-sm font-bold text-gray-900 dark:text-white truncate"></h3>
                        </div>

                        <!-- Video Title Text -->
                        <p id="tk-text" class="text-xs text-gray-600 dark:text-gray-300 line-clamp-3 leading-relaxed mb-4 font-normal bg-gray-50/60 dark:bg-slate-800/80 p-3 rounded-xl border border-gray-100/80 dark:border-slate-700/60"></p>
                    </div>

                    <!-- Actions Container -->
                    <div id="tk-download-buttons" class="mt-auto flex flex-col gap-2.5 pt-2">
                        <!-- ปุ่มดาวน์โหลดจะถูกสร้างขึ้นตรงนี้ -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Error Message -->
        <div id="tk-error" class="hidden mt-4 p-4 bg-red-50/80 dark:bg-red-950/40 backdrop-blur-md border border-red-100 dark:border-red-900/50 text-red-600 dark:text-red-400 rounded-2xl text-xs font-semibold flex items-center gap-3">
            <div class="p-1 bg-red-100 dark:bg-red-900/50 rounded-lg shrink-0">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                </svg>
            </div>
            <span id="tk-error-text"></span>
        </div>

    </main>

    <!-- Footer Section -->
    <footer class="border-t border-gray-200/60 dark:border-slate-800/80 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md transition-colors duration-300 w-full">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs sm:text-sm text-gray-500 dark:text-gray-400">
            <!-- Copyright Info -->
            <div class="flex items-center gap-1.5 text-center sm:text-left">
                <span>&copy; 2026 <strong class="font-semibold text-gray-700 dark:text-gray-200">My Web Tools</strong>. All rights reserved.</span>
            </div>

            <!-- GitHub Repository Link -->
            <a href="https://github.com/Horizon25k/my-web-tools" target="_blank" rel="noopener noreferrer" 
               class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-gray-100 dark:bg-slate-800/80 hover:bg-gray-200 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-300 hover:text-pink-600 dark:hover:text-pink-400 font-medium transition-all duration-200 group border border-gray-200/60 dark:border-slate-700/60 shadow-sm">
                <svg class="w-4 h-4 fill-current transition-transform group-hover:scale-110" viewBox="0 0 24 24">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                <span>GitHub Repository</span>
            </a>
        </div>
    </footer>

    <script>
        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function fetchTikTok() {
            const urlInput = document.getElementById('tk-url-input').value.trim();
            const errorDiv = document.getElementById('tk-error');
            const errorText = document.getElementById('tk-error-text');
            const resultDiv = document.getElementById('tk-result');
            const loadingDiv = document.getElementById('tk-loading');

            errorDiv.classList.add('hidden');
            resultDiv.classList.add('hidden');

            if (!urlInput) {
                if (typeof showToast === 'function') {
                    showToast('กรุณาวางลิงก์ TikTok ก่อนครับ', 'error');
                }
                errorText.textContent = 'กรุณาวางลิงก์ TikTok ก่อนครับ';
                errorDiv.classList.remove('hidden');
                return;
            }

            const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`;

            loadingDiv.classList.remove('hidden');

            try {
                const response = await fetch(apiUrl);
                const json = await response.json();
                
                if (json.code !== 0 || !json.data) {
                    throw new Error(json.msg || 'ไม่พบวิดีโอนี้ หรือวิดีโอถูกตั้งเป็นส่วนตัว');
                }

                const data = json.data;

                document.getElementById('tk-thumbnail').src = data.cover || '';
                document.getElementById('tk-avatar').src = data.author.avatar || '';
                document.getElementById('tk-author').textContent = `${data.author.nickname} (@${data.author.unique_id})`;
                document.getElementById('tk-text').textContent = data.title || 'ไม่มีคำอธิบายโพสต์';

                const btnContainer = document.getElementById('tk-download-buttons');
                btnContainer.innerHTML = '';

                // MP4 Normal
                if (data.play) {
                    const sizeStr = formatBytes(data.size);
                    btnContainer.appendChild(createDownloadButton('ดาวน์โหลด MP4', sizeStr, data.play, `TikTok_${data.author.unique_id}.mp4`, 'bg-gray-900 hover:bg-black dark:bg-slate-800 dark:hover:bg-slate-700', 'MP4'));
                }

                // MP4 HD
                if (data.hdplay) {
                    const sizeStr = formatBytes(data.hd_size);
                    btnContainer.appendChild(createDownloadButton('ดาวน์โหลด MP4 HD', sizeStr, data.hdplay, `TikTok_HD_${data.author.unique_id}.mp4`, 'bg-pink-600 hover:bg-pink-700 shadow-pink-500/20', 'HD'));
                }

                // MP3 Audio
                if (data.music) {
                    const sizeStr = formatBytes(data.music_info ? data.music_info.size : 0);
                    btnContainer.appendChild(createDownloadButton('ดาวน์โหลด MP3', sizeStr, data.music, `TikTok_Audio_${data.author.unique_id}.mp3`, 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-500/20', 'MP3'));
                }

                resultDiv.classList.remove('hidden');
                if (typeof showToast === 'function') {
                    showToast('ดึงข้อมูลวิดีโอ TikTok สำเร็จ!', 'success');
                }
            } catch (error) {
                const msg = error.message || 'เกิดข้อผิดพลาดในการดึงข้อมูล กรุณาลองใหม่อีกครั้ง';
                errorText.textContent = msg;
                errorDiv.classList.remove('hidden');
                if (typeof showToast === 'function') {
                    showToast(msg, 'error');
                }
            } finally {
                loadingDiv.classList.add('hidden');
            }
        }

        function createDownloadButton(label, sizeText, url, filename, colorClasses, typeTag) {
            const btn = document.createElement('button');
            btn.className = `w-full ${colorClasses} text-white font-semibold py-3 px-4 rounded-xl shadow-md flex items-center justify-between text-xs sm:text-sm transition-all active:scale-[0.99] group`;
            
            let iconSvg = typeTag === 'MP3'
                ? `<svg class="w-4 h-4 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>`
                : `<svg class="w-4 h-4 transition-transform group-hover:translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>`;
            
            const displayBadge = sizeText ? `${typeTag} • ${sizeText}` : typeTag;

            btn.innerHTML = `
                <span class="flex items-center gap-2">
                    ${iconSvg}
                    ${label}
                </span>
                <span class="bg-white/20 text-white px-2.5 py-1 rounded-lg text-[11px] font-medium tracking-wide">
                    ${displayBadge}
                </span>
            `;
            
            btn.onclick = () => downloadMediaBlob(url, filename, btn);
            return btn;
        }

        async function downloadMediaBlob(url, filename, btnElement) {
            const originalHTML = btnElement.innerHTML;
            btnElement.innerHTML = `<span class="flex items-center gap-2"><div class="animate-spin rounded-full h-4 w-4 border-2 border-white/30 border-t-white"></div> กำลังดาวน์โหลด...</span>`;
            btnElement.disabled = true;
            btnElement.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);

                if (typeof showToast === 'function') {
                    showToast('ดาวน์โหลดไฟล์เรียบร้อยแล้ว!', 'success');
                }
            } catch (e) {
                window.open(url, '_blank');
                if (typeof showToast === 'function') {
                    showToast('เปิดลิงก์ดาวน์โหลดในแท็บใหม่แล้ว', 'info');
                }
            } finally {
                btnElement.innerHTML = originalHTML;
                btnElement.disabled = false;
                btnElement.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
    </script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
