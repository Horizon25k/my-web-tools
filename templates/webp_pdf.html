<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter</title>
    
    <!-- ป้องกันแสงสีขาววูบวาบ (FOUC Mitigation) -->
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- SortableJS สำหรับลากวาง -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        .sortable-ghost { opacity: 0.3; transform: scale(0.95); }
        .sortable-drag { cursor: grabbing !important; }
        .preview-item { cursor: grab; }
        .preview-item:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-300">

    <!-- Top Navigation Bar -->
    <header class="max-w-5xl mx-auto pt-6 px-4 sm:px-6 flex items-center justify-between">
        <a href="/" class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-600 bg-white/80 hover:bg-white border border-gray-200/80 rounded-full shadow-sm hover:shadow transition-all duration-200 backdrop-blur-md group">
            <svg class="w-4 h-4 transition-transform group-hover:-translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            หน้าหลัก
        </a>

        <!-- ปุ่มสลับธีม -->
        <button id="theme-toggle" class="flex items-center justify-center w-10 h-10 bg-white/80 border border-gray-200/80 rounded-full shadow-sm text-gray-600 hover:text-indigo-600 hover:bg-white transition-all duration-200 backdrop-blur-md focus:outline-none" aria-label="Toggle Dark Mode">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 pt-10 pb-20">
        
        <!-- Hero Section -->
        <div class="text-center mb-10">
            
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900 mb-3">
                แปลงไฟล์รูปภาพเป็น <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">PDF</span>
            </h1>
            <p class="text-sm sm:text-base text-gray-500 max-w-lg mx-auto leading-relaxed">
                รองรับไฟล์ JPG, PNG และ WEBP | เรียงลำดับชื่อให้อัตโนมัติ และลากสลับตำแหน่งหน้าได้ตามต้องการ
            </p>
        </div>

        <!-- Controls Card -->
        <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl shadow-gray-200/50 border border-gray-100 mb-8 transition-all">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                
                <!-- 1. อัปโหลดไฟล์ -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2.5">
                        1. อัปโหลดไฟล์รูปภาพ (JPG, PNG, WEBP)
                    </label>
                    <div class="relative">
                        <input type="file" id="fileInput" accept="image/webp, image/jpeg, image/png, image/jpg" multiple 
                            class="block w-full text-xs text-gray-500 
                            file:mr-4 file:py-3 file:px-4 file:rounded-xl file:border-0 
                            file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 
                            hover:file:bg-indigo-100 border border-gray-200 rounded-2xl bg-gray-50/50 p-1.5 focus:outline-none transition-all">
                    </div>
                </div>

                <!-- 2. ตั้งชื่อไฟล์ -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2.5">
                        2. กำหนดชื่อไฟล์ PDF
                    </label>
                    <input type="text" id="filenameInput" placeholder="document (ไม่ต้องใส่ .pdf)" 
                        class="block w-full border border-gray-200 bg-gray-50/50 rounded-2xl py-3 px-4 
                        focus:outline-none focus:border-indigo-500 focus:bg-white text-sm transition-all placeholder:text-gray-400 font-medium">
                </div>
            </div>
            
            <!-- Tip Banner -->
            <div class="text-xs text-gray-600 bg-amber-50/70 border border-amber-200/60 p-4 rounded-2xl flex items-start gap-3">
                <div class="p-1 bg-amber-100 rounded-lg shrink-0 text-amber-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <p class="leading-relaxed">
                    <strong class="font-semibold text-gray-800">เคล็ดลับ:</strong> หลังเลือกไฟล์ สามารถ <strong class="font-semibold text-gray-800">คลิกค้างที่รูปภาพแล้วลาก (Drag & Drop)</strong> เพื่อเรียงสลับหน้าได้ทันที ลำดับในเอกสาร PDF จะยึดตามที่จัดไว้บนหน้าจอ
                </p>
            </div>
        </div>

        <!-- Preview Container -->
        <div id="previewContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-8"></div>

        <!-- Convert Button -->
        <div class="text-center">
            <button id="convertBtn" class="hidden w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-2xl shadow-lg shadow-indigo-500/25 transition-all duration-200 active:scale-95 text-sm sm:text-base">
                แปลงเป็นไฟล์ PDF
            </button>
        </div>

    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const filenameInput = document.getElementById('filenameInput');
        const previewContainer = document.getElementById('previewContainer');
        const convertBtn = document.getElementById('convertBtn');
        let imageFiles = [];
        let sortableInstance = null;

        // อัลกอริทึม Natural Sort ขั้นสูงสำหรับแยกข้อความกับตัวเลข
        const naturalSort = (a, b) => {
            const ax = [], bx = [];
            a.replace(/(\d+)|(\D+)/g, function(_, $1, $2) { ax.push([$1 || Infinity, $2 || ""]) });
            b.replace(/(\d+)|(\D+)/g, function(_, $1, $2) { bx.push([$1 || Infinity, $2 || ""]) });
            
            while(ax.length && bx.length) {
                const an = ax.shift();
                const bn = bx.shift();
                const nn = (an[0] - bn[0]) || an[1].localeCompare(bn[1]);
                if(nn) return nn;
            }
            return ax.length - bx.length;
        };

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // เรียงลำดับไฟล์ด้วย Natural Sort ทันทีที่เลือกไฟล์
            files.sort((a, b) => naturalSort(a.name, b.name));

            previewContainer.innerHTML = '';
            imageFiles = [];

            files.forEach((file, index) => {
                const objectURL = URL.createObjectURL(file);
                imageFiles.push({ file: file, url: objectURL, name: file.name, id: `img-${Date.now()}-${index}` });

                const div = document.createElement('div');
                div.className = 'preview-item relative bg-white p-3 border border-gray-100 rounded-2xl shadow-md hover:shadow-xl transition-all duration-200 group';
                div.dataset.id = imageFiles[index].id;
                
                div.innerHTML = `
                    <div class="absolute top-2.5 left-2.5 bg-black/75 backdrop-blur-md text-white text-[11px] font-bold w-6 h-6 rounded-full flex items-center justify-center z-10 index-badge shadow-sm">
                        ${index + 1}
                    </div>
                    <div class="aspect-w-3 aspect-h-4 bg-gray-50 rounded-xl overflow-hidden mb-2.5 border border-gray-100 flex items-center justify-center p-1">
                        <img src="${objectURL}" class="object-contain w-full h-32 group-hover:scale-105 transition-transform duration-300" alt="${file.name}">
                    </div>
                    <p class="text-[11px] text-center truncate text-gray-500 font-medium px-1" title="${file.name}">${file.name}</p>
                `;
                previewContainer.appendChild(div);
            });

            convertBtn.classList.remove('hidden');

            // เปิดใช้งาน SortableJS (Drag & Drop)
            if (sortableInstance) sortableInstance.destroy();
            sortableInstance = new Sortable(previewContainer, {
                animation: 200,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: function () { updateBadges(); }
            });
        });

        function updateBadges() {
            const items = previewContainer.querySelectorAll('.preview-item');
            items.forEach((item, index) => {
                item.querySelector('.index-badge').innerText = index + 1;
            });
        }

        convertBtn.addEventListener('click', async () => {
            if (imageFiles.length === 0) return;
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            
            // อ่านลำดับใหม่ล่าสุดจากหน้าจอ
            const domItems = previewContainer.querySelectorAll('.preview-item');
            const sortedImages = [];
            domItems.forEach(item => {
                const id = item.dataset.id;
                const found = imageFiles.find(img => img.id === id);
                if (found) sortedImages.push(found);
            });

            convertBtn.innerText = 'กำลังสร้างไฟล์ PDF...';
            convertBtn.disabled = true;
            convertBtn.classList.add('opacity-50', 'cursor-not-allowed');

            for (let i = 0; i < sortedImages.length; i++) {
                const imgObj = sortedImages[i];
                if (i > 0) pdf.addPage();

                const img = new Image();
                img.src = imgObj.url;
                
                // ตรวจสอบประเภทไฟล์เพื่อให้ jsPDF ฝังรูปลง PDF ได้ถูกต้อง
                let imgFormat = imgObj.file.type.split('/')[1].toUpperCase();
                if (imgFormat === 'JPG') imgFormat = 'JPEG';
                
                await new Promise((resolve) => {
                    img.onload = () => {
                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = pdf.internal.pageSize.getHeight();
                        const imgRatio = img.width / img.height;
                        const pdfRatio = pdfWidth / pdfHeight;

                        let finalWidth, finalHeight;
                        if (imgRatio > pdfRatio) {
                            finalWidth = pdfWidth;
                            finalHeight = pdfWidth / imgRatio;
                        } else {
                            finalHeight = pdfHeight;
                            finalWidth = pdfHeight * imgRatio;
                        }

                        const x = (pdfWidth - finalWidth) / 2;
                        const y = (pdfHeight - finalHeight) / 2;

                        pdf.addImage(img, imgFormat, x, y, finalWidth, finalHeight);
                        resolve();
                    };
                });
            }

            // จัดการชื่อไฟล์
            let finalFilename = filenameInput.value.trim();
            if (finalFilename === '') finalFilename = 'document';
            if (!finalFilename.toLowerCase().endsWith('.pdf')) {
                finalFilename += '.pdf';
            }

            pdf.save(finalFilename);

            convertBtn.innerText = 'แปลงเป็นไฟล์ PDF';
            convertBtn.disabled = false;
            convertBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        });
    </script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
