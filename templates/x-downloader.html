<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>X (Twitter) Video Downloader (Local API)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- ปุ่มสลับโหมดมืด/สว่าง -->
<div class="absolute top-4 right-4 sm:top-6 sm:right-6">
    <button id="theme-toggle" class="flex items-center justify-center w-11 h-11 bg-white border border-gray-200 rounded-full shadow-sm text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 hover:border-indigo-200 transition-all duration-300 focus:outline-none" aria-label="Toggle Dark Mode">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>
</div>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-3xl mx-auto">
        
        <a href="/" class="inline-flex items-center text-gray-600 hover:text-gray-900 mb-6 transition-colors">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            กลับหน้าหลัก
        </a>

        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-2">ดาวน์โหลดคลิป <span class="text-blue-500">X (Twitter)</span></h1>
        </div>
        
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-md border border-gray-200">
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-3">วางลิงก์โพสต์ X หรือ Twitter ที่นี่</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="x-url-input" 
                        class="flex-1 rounded-lg border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-3.5 border text-gray-700" 
                        placeholder="เช่น https://x.com/username/status/123456789...">
                    <button onclick="fetchXVideo()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3.5 rounded-lg transition-colors font-bold shadow-md min-w-[120px]">
                        ดึงข้อมูล
                    </button>
                </div>
            </div>

            <!-- สถานะกำลังโหลด -->
            <div id="x-loading" class="hidden text-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600 mx-auto"></div>
                <p class="mt-4 text-gray-600 font-medium" id="loading-text">กำลังเชื่อมต่อระบบหลังบ้าน...</p>
            </div>

            <!-- แสดงผลลัพธ์ -->
            <div id="x-result" class="hidden mt-8 border-t border-gray-100 pt-8">
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="w-full md:w-1/2">
                        <img id="x-thumbnail" class="w-full rounded-xl shadow-sm border border-gray-200 object-cover aspect-video" src="" alt="Thumbnail">
                    </div>
                    <div class="w-full md:w-1/2 flex flex-col">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
                            </div>
                            <h3 id="x-author" class="text-md font-bold text-gray-900 truncate"></h3>
                        </div>
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 mb-6 flex-1">
                            <p id="x-text" class="text-gray-700 text-sm line-clamp-4"></p>
                        </div>
                        
                        <div class="mt-auto">
                            <h4 class="text-sm font-semibold text-gray-900 mb-3">ไฟล์วิดีโอ (MP4):</h4>
                            <div id="x-download-buttons" class="flex flex-col gap-3">
                                <!-- ลิงก์ดาวน์โหลดจะถูกเพิ่มที่นี่ -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- แสดงข้อผิดพลาด -->
            <div id="x-error" class="hidden mt-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm flex items-start gap-3">
                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>
                <span id="x-error-text" class="font-medium"></span>
            </div>
        </div>
    </div>

    <script>
        async function fetchXVideo() {
            const urlInput = document.getElementById('x-url-input').value.trim();
            const errorDiv = document.getElementById('x-error');
            const errorText = document.getElementById('x-error-text');
            const resultDiv = document.getElementById('x-result');
            const loadingDiv = document.getElementById('x-loading');

            errorDiv.classList.add('hidden');
            resultDiv.classList.add('hidden');

            if (!urlInput) {
                errorText.textContent = 'กรุณาวางลิงก์ X หรือ Twitter ก่อน';
                errorDiv.classList.remove('hidden');
                return;
            }

            loadingDiv.classList.remove('hidden');

            try {
                // แก้ไขรูปแบบลิงก์ fetch ให้ถูกต้อง ไม่มีวงเล็บ Markdown
                const response = await fetch('https://my-web-tools-axku.onrender.com/api/get_x_video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'เกิดข้อผิดพลาดในการดึงข้อมูลจากระบบหลังบ้าน');
                }

                document.getElementById('x-thumbnail').src = data.thumbnail || '';
                document.getElementById('x-author').textContent = `${data.author} (@${data.author_id})`;
                document.getElementById('x-text').textContent = data.text;

                const btnContainer = document.getElementById('x-download-buttons');
                btnContainer.innerHTML = '';

                const btn = document.createElement('a');
                btn.href = `https://my-web-tools-axku.onrender.com/api/force_download?url=${encodeURIComponent(data.video_url)}`;
                    btn.setAttribute('download', 'x-video.mp4');
                btn.rel = 'noreferrer noopener'; 
                btn.className = 'w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-lg shadow-md flex items-center justify-center gap-2 transition-all transform hover:-translate-y-0.5 cursor-pointer';
                btn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"></path></svg> 
                    Dowlond (MP4)`;
                
                btnContainer.appendChild(btn);
                resultDiv.classList.remove('hidden');

            } catch (error) {
                errorText.textContent = error.message;
                errorDiv.classList.remove('hidden');
            } finally {
                loadingDiv.classList.add('hidden');
            }
        }
    </script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
