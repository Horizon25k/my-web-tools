<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>X Video Downloader</title>
    
    <!-- ป้องกันแสงสีขาววูบวาบ (FOUC Mitigation) -->
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen antialiased selection:bg-black selection:text-white transition-colors duration-300">

    <!-- Top Navigation Bar -->
    <header class="max-w-4xl mx-auto pt-6 px-4 sm:px-6 flex items-center justify-between">
        <a href="/" class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-600 bg-white/80 hover:bg-white border border-gray-200/80 rounded-full shadow-sm hover:shadow transition-all duration-200 backdrop-blur-md group">
            <svg class="w-4 h-4 transition-transform group-hover:-translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            หน้าหลัก
        </a>

        <!-- ปุ่มสลับธีม -->
        <button id="theme-toggle" class="flex items-center justify-center w-10 h-10 bg-white/80 border border-gray-200/80 rounded-full shadow-sm text-gray-600 hover:text-black hover:bg-white transition-all duration-200 backdrop-blur-md focus:outline-none" aria-label="Toggle Dark Mode">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-4 sm:px-6 pt-10 pb-16">
        
        <!-- Hero Title -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-black text-white rounded-2xl mb-4 shadow-lg shadow-black/10">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
                </svg>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900 mb-2">
                X Video Downloader
            </h1>
            <p class="text-sm sm:text-base text-gray-500 max-w-md mx-auto">
                ดาวน์โหลดวิดีโอจาก X (Twitter) คุณภาพสูงได้ทันที ไม่ติดลายน้ำ
            </p>
        </div>
        
        <!-- Input Card -->
        <div class="bg-white p-3 sm:p-4 rounded-3xl shadow-xl shadow-gray-200/50 border border-gray-100 transition-all">
            <div class="relative flex items-center">
                <div class="absolute left-4 text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                    </svg>
                </div>
                <input type="text" id="x-url-input" 
                    class="w-full pl-11 pr-28 py-3.5 bg-gray-50/70 text-gray-900 rounded-2xl border border-transparent focus:border-black/20 focus:bg-white focus:ring-0 text-sm transition-all placeholder:text-gray-400 font-medium" 
                    placeholder="วางลิงก์โพสต์ X ที่นี่...">
                <button onclick="fetchXVideo()" 
                    class="absolute right-1.5 bg-black hover:bg-gray-800 text-white text-xs sm:text-sm font-semibold px-5 py-2.5 rounded-xl transition-all shadow-md active:scale-95 flex items-center gap-1.5">
                    <span>ดึงข้อมูล</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Status Loading -->
        <div id="x-loading" class="hidden text-center py-12">
            <div class="inline-flex items-center justify-center p-3 bg-white rounded-full shadow-md border border-gray-100 mb-3">
                <div class="animate-spin rounded-full h-6 w-6 border-2 border-gray-200 border-t-black"></div>
            </div>
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider" id="loading-text">กำลังประมวลผลวิดีโอ...</p>
        </div>

        <!-- Result Display -->
        <div id="x-result" class="hidden mt-6 bg-white rounded-3xl p-5 sm:p-6 shadow-xl shadow-gray-200/50 border border-gray-100 transition-all">
            <div class="flex flex-col sm:flex-row gap-5 items-start">
                
                <!-- Thumbnail -->
                <div class="w-full sm:w-5/12 relative group overflow-hidden rounded-2xl border border-gray-100 bg-gray-900">
                    <img id="x-thumbnail" class="w-full aspect-video object-cover group-hover:scale-105 transition-transform duration-300" src="" alt="Thumbnail">
                </div>

                <!-- Detail & Download Button -->
                <div class="w-full sm:w-7/12 flex flex-col justify-between self-stretch">
                    <div>
                        <!-- Author Info -->
                        <div class="flex items-center gap-2 mb-2">
                            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-black text-white text-xs font-bold">X</span>
                            <h3 id="x-author" class="text-sm font-bold text-gray-900 truncate"></h3>
                        </div>

                        <!-- Tweet Content Text -->
                        <p id="x-text" class="text-xs text-gray-600 line-clamp-3 leading-relaxed mb-4 font-normal bg-gray-50/60 p-3 rounded-xl border border-gray-100/80"></p>
                    </div>

                    <!-- Actions Container -->
                    <div id="x-download-buttons" class="mt-auto pt-2">
                        <!-- ปุ่มดาวน์โหลดจะถูกสร้างขึ้นตรงนี้ -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Error Message -->
        <div id="x-error" class="hidden mt-4 p-4 bg-red-50/80 backdrop-blur-md border border-red-100 text-red-600 rounded-2xl text-xs font-semibold flex items-center gap-3">
            <div class="p-1 bg-red-100 rounded-lg shrink-0">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                </svg>
            </div>
            <span id="x-error-text"></span>
        </div>

    </main>

    <script>
        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return 'ไม่ทราบขนาด';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function fetchXVideo() {
            const urlInput = document.getElementById('x-url-input').value.trim();
            const errorDiv = document.getElementById('x-error');
            const errorText = document.getElementById('x-error-text');
            const resultDiv = document.getElementById('x-result');
            const loadingDiv = document.getElementById('x-loading');

            errorDiv.classList.add('hidden');
            resultDiv.classList.add('hidden');

            if (!urlInput) {
                errorText.textContent = 'กรุณาวางลิงก์โพสต์ X ก่อนครับ';
                errorDiv.classList.remove('hidden');
                return;
            }

            loadingDiv.classList.remove('hidden');

            try {
                const response = await fetch('/api/get_x_video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'ไม่สามารถดึงข้อมูลวิดีโอจากลิงก์นี้ได้');
                }

                document.getElementById('x-thumbnail').src = data.thumbnail || '';
                document.getElementById('x-author').textContent = `${data.author} (@${data.author_id})`;
                document.getElementById('x-text').textContent = data.text || 'ไม่มีคำอธิบายโพสต์';

                const btnContainer = document.getElementById('x-download-buttons');
                btnContainer.innerHTML = '';

                const sizeText = data.filesize ? formatBytes(data.filesize) : 'ไม่ทราบขนาด';

                const btn = document.createElement('a');
                btn.href = `/api/force_download?url=${encodeURIComponent(data.video_url)}`;
                btn.setAttribute('download', 'x-video.mp4');
                btn.rel = 'noreferrer noopener'; 
                btn.className = 'w-full bg-black hover:bg-gray-800 text-white font-semibold py-3 px-4 rounded-xl shadow-md flex items-center justify-between text-xs sm:text-sm transition-all active:scale-[0.99] group';
                
                btn.innerHTML = `
                    <span class="flex items-center gap-2">
                        <svg class="w-4 h-4 transition-transform group-hover:translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        ดาวน์โหลด MP4
                    </span>
                    <span class="bg-white/20 text-white px-2.5 py-1 rounded-lg text-[11px] font-medium tracking-wide">
                        ${sizeText}
                    </span>
                `;
                
                btnContainer.appendChild(btn);
                resultDiv.classList.remove('hidden');

            } catch (error) {
                errorText.textContent = error.message;
                errorDiv.classList.remove('hidden');
            } finally {
                loadingDiv.classList.add('hidden');
            }
        }
    </script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
